function act([k,a,b]){if(k=='pr'||k=='ad'||k=='export'||k=='import'||k=='reset')sfx('click');
if(k=='buy'||k=='fill'){const p=ALL.find(x=>x.id==a),i=STORES[cur].P.indexOf(p),ps=S.prod[a];let n=k=='fill'?mx()-ps.stock:Math.min(+b,mx()-ps.stock);if(n<=0)return toast('Shelf is full!');

else if(k=='pr'){const p=ALL.find(x=>x.id==a);S.prod[a].price=clamp(S.prod[a].price+ +b,1,p.ref*3)}
else if(k=='up'){const u=ups().find(x=>x.k==a),l=lv(a),c=ucost(u,l);if(l>=u.max)return;if(S.money<c)return toast('Not enough cash 💸');S.money-=c;if(a=='range')S.up.r[cur]++;else S.up[a]++;S.upc++;S.disc=0;mfx(-c);sfx('upgrade');applyUp();toast('Upgraded! 🎉')}
else if(k=='store'){const s=+a;if(!S.own[s]){if(S.money<STORES[s].cost)return toast('Not enough cash 💸');S.money-=STORES[s].cost;S.own[s]=1;mfx(-STORES[s].cost);sfx('unlock');confetti();applyUp();toast('New shop opened! 🎉')}cur=s;if(s>0)toast('Buy stock for this shop in the Stock tab 📦')}
else if(k=='ad'){const m=adCan(a);if(m)return toast(m);showAd(()=>reward(a))}
else if(k=='export'){const s=btoa(JSON.stringify(S));try{navigator.clipboard.writeText(s)}catch(e){}prompt('Backup code (copied if possible). Save it somewhere safe:',s)}
else if(k=='import'){const s=prompt('Paste your backup code:');if(!s)return;try{const j=JSON.parse(atob(s.trim()));if(!valid(j))throw 0;S=Object.assign(fresh(),j);fix();applyUp();save();toast('Backup loaded ✅')}catch(e){toast('That code is not valid')}}
else if(k=='reset'){if(confirm('Delete ALL progress and start over?')){S=fresh();fix();cur=0;applyUp();save();toast('Fresh start')}}
save();render()}

function renderSheet(){$('sc').innerHTML=SHT[sh]();$('sheet').classList.add('on')}
function openSheet(p,from=''){sh=p;shFrom=from;renderSheet();sfx('open')}
function closeSheet(){sh='';shFrom='';$('sheet').classList.remove('on')}
function ask(msg,fn){askMsg=msg;askFn=fn;shFrom=sh;sh='ask';renderSheet()}
$('sheet').onclick=e=>{const b=e.target.closest('[data-s]');if(!b||b.disabled)return;sfx('click');const[a,x]=b.dataset.s.split(':');
if(a=='go'){openSheet(x,sh)}else if(a=='close')closeSheet();else if(a=='back'){if(shFrom){sh=shFrom;shFrom='';renderSheet()}else closeSheet()}
else if(a=='menu'){save();closeSheet();showMenu()}
else if(a=='t'){ST[x]=ST[x]?0:1;saveST();aVol();if(x=='m')music(AU.want);renderSheet()}
else if(a=='q'){ST.q=ST.q?0:1;saveST();setQ();renderSheet()}
else if(a=='export'||a=='import')act([a])
else if(a=='ask'){ask('This will delete ALL your progress. Continue?',()=>{S=fresh();fix();S.intro=1;initMis();S.lv=1;cur=0;applyUp();save();toast('Fresh start');sh='set';shFrom='';renderSheet()})}
else if(a=='yes'){const f=askFn;askFn=null;shFrom='';f&&f()}
else if(a=='cd'){claimDaily();renderSheet()}else if(a=='cdc'){claimDch();renderSheet()}
else if(a=='cm'){const m=S.mis[x];if(mProg(m)<m.n)return;S.money+=m.r;mfx(m.r);sfx('cash');confetti(10);S.mis[x]=newMis();save();renderSheet()}};
$('sheet').addEventListener('input',e=>{const k=e.target.dataset.sl;if(!k)return;ST[k]=e.target.value/100;aVol();saveST()});
$('sheet').addEventListener('change',e=>{const k=e.target.dataset.sl;if(k)sfx(k=='sv'?'cash':'click')});
$('pbtn').onclick=()=>openSheet('pause');
/* main menu + story */
const hasSave=()=>S.intro||S.sold>0||S.rev>0;
function showMenu(){inMenu=true;$('menu').classList.add('on');$('hud').style.display='none';$('tabs').style.display='none';tab='';render();$('bPlay').textContent=hasSave()?'▶ CONTINUE':'▶ PLAY';$('bNew').style.display=hasSave()?'':'none';music('menu')}
function enterGame(){aInit();$('menu').classList.remove('on');inMenu=false;$('hud').style.display='';$('tabs').style.display='';music('game');last=performance.now();refresh();
if(offPending)showOff();else if(dailyInfo().av)openSheet('daily');if(!S.tipc){S.tipc=1;setTimeout(()=>toast('Tip: stand on the green ring behind the counter to serve customers 👷'),2500)}}
function showOff(){const o=offPending;offPending=null;modal(`<h2>Welcome back! 💰</h2><p>While you were away, your shops sold <b>${o.sold}</b> items and earned <b>$${fm(o.gain)}</b>.</p><p>(Offline earnings are capped at 2 hours and limited by your stock.)</p><button id="mad" class="btn g">📺 Watch ad: double it!</button>`,'Collect',()=>{refresh();if(dailyInfo().av)openSheet('daily')});
$('mad').onclick=()=>{if(left('off')<=0)return toast('Daily limit reached');showAd(()=>{S.ads.n.off=(S.ads.n.off||0)+1;S.money+=o.gain;mfx(o.gain);toast('Doubled! +$'+fm(o.gain));refresh();$('mad').style.display='none'})}}
const SL=[['💔','It was a normal Tuesday… until your girlfriend dumped you. In public. Next to the free samples.'],['😭','"You are BROKE," she said, and stole your last fries on her way out.'],['🏚️','So you rented a tiny roadside shop that smells like old chips. Budget: $500 and a lot of pride.'],['💪','Stock the shelves, set clever prices and serve every customer. One day you will own the whole mall!'],['💸','She called you broke.<br><b>Build an empire.</b>']];
let si=0;function story(){si=0;$('menu').classList.remove('on');$('story').style.display='flex';slide()}
function slide(){$('stE').textContent=SL[si][0];$('stT').innerHTML=SL[si][1];$('stN').textContent=si==SL.length-1?"Let's go! 🚀":'Next ▶';const c=$('stC');c.style.animation='none';void c.offsetWidth;c.style.animation='';sfx('open')}
function endStory(){$('story').style.display='none';S.intro=1;save();enterGame()}
$('stN').onclick=()=>{if(si<SL.length-1){si++;slide()}else endStory()};$('stS').onclick=endStory;
$('bPlay').onclick=()=>{aInit();if(!S.intro&&!hasSave())story();else{S.intro=1;enterGame()}};
$('bNew').onclick=()=>{aInit();ask('Start a brand-new game? Your current progress will be erased.',()=>{S=fresh();fix();initMis();S.lv=1;offPending=null;cur=0;applyUp();save();closeSheet();story()});$('sheet').classList.add('on')};
$('bSet').onclick=()=>{aInit();openSheet('set')};$('bAbout').onclick=()=>{aInit();openSheet('about')};
/* ---------- LAST-ITEM AUCTION ---------- */
let AUC={on:0};
function aucStart(a,b){const s=a.s,p=STORES[s].P[a.pi],P0=S.prod[p.id].price;RES[p.id]=(RES[p.id]||0)+1;
const m=()=>Math.max(P0*1.12,p.ref*(.95+Math.random()*1.05));
AUC={on:1,ph:'bid',s,pi:a.pi,p,a,b,bid:[P0,P0],max:[m(),m()],top:-1,t:0,dur:16,nx:1.2,bb:0,hype:3,rd:0,amount:0,win:-1,dbl:0,t2:0};
[a,b].forEach(c=>{c.look=0;c.reach=0;setSt(c,'auction');c.arg=0});
const sp=bs(a.pi),ax=a.pi>>1>2?[0,.35]:[.35,0];a.ap=[sp[0]-ax[0],sp[1]-ax[1]];b.ap=[sp[0]+ax[0],sp[1]+ax[1]];
toast('🔨 AUCTION! Two shoppers want the last '+p.n+'!');sfx('notify');tab='';render();aucFull()}
function aucEnd(w){const A=AUC;if(!A.on||A.ph!='bid')return;const p=A.p,ps=S.prod[p.id],s=A.s,win=w?A.b:A.a,lose=w?A.a:A.b;RES[p.id]=Math.max(0,(RES[p.id]||0)-1);
if(ps.stock<=0){aucCancel();return}
const amt=Math.round(A.bid[w]);sale(p,amt);A.ph='done';A.amount=amt;A.win=w;A.t2=0;win.arg=0;lose.arg=0;
win.it=pItem(s,A.pi);win.it.position.set(0,.95,.4);win.it.scale.setScalar(.85);win.g.add(win.it);win.reach=1;win.hop=.6;pop('🏆 +$'+fm(amt),win.g);fly(s,A.pi);shelf(s,A.pi);sfx('cash');confetti(8);
setSt(win,'leave');bad(lose,'😭 Outbid!',0);aucFull()}
function aucCancel(){const A=AUC;if(!A.on)return;if(A.ph=='bid'){RES[A.p.id]=Math.max(0,(RES[A.p.id]||0)-1);bad(A.a,'😒 No deal',.01);bad(A.b,'😒 No deal',.01)}AUC={on:0};aucFull()}
function aucDouble(A){if(A.dbl||!A.amount)return;A.dbl=1;const x=A.amount;S.money+=x;S.rev+=x;S.profit+=x;mfx(x);toast('📺 Auction winnings doubled! +$'+fm(x));aucFull()}
function aucUpd(dt){if(!AUC.on)return;const A=AUC,a=A.a,b=A.b;
if(A.ph=='bid'){if(!A.rd){[a,b].forEach(c=>{if(!c.arg&&go(c,c.ap[0],c.ap[1],dt,2.6))c.arg=1});
if(a.arg&&b.arg){A.rd=1;const dx=b.g.position.x-a.g.position.x,dz=b.g.position.z-a.g.position.z;a.ry=Math.atan2(dx,dz);b.ry=Math.atan2(-dx,-dz);pop('😠 MINE!',a.g,'bad');pop('🤬 NO, MINE!',b.g,'bad');aucFull()}return}
A.t+=dt;A.nx-=dt;A.bb-=dt;if(A.bb<=0){A.bb=.9;pop(['💢','😡 MINE!','🤬','💥'][Math.random()*4|0],(Math.random()<.5?a:b).g,'bad')}
if(A.nx<=0){A.nx=.9+Math.random()*.9;const cur0=Math.max(A.bid[0],A.bid[1]),lo=A.top<0?(Math.random()<.5?0:1):1-A.top,step=Math.max(1,Math.round(A.p.ref*(.03+Math.random()*.07))),nb2=Math.min(A.max[lo],cur0+(A.top<0?Math.max(1,Math.round(step/2)):step));
if(nb2<=cur0){aucEnd(1-lo);return}A.bid[lo]=nb2;A.top=lo;pop('💰 $'+fm(nb2),(lo?b:a).g);sfx('buy')}
if(A.t>=A.dur)aucEnd(A.top<0?(Math.random()<.5?0:1):A.top)}
else{A.t2+=dt;if(A.t2>10&&!adBusy){AUC={on:0};aucFull()}}}
function aucFull(){const el=$('auc'),A=AUC;if(!A.on){el.style.display='none';el.innerHTML='';return}el.style.display='block';const p=A.p;
if(A.ph=='bid')el.innerHTML=`<div class=ah>🔨 LAST ITEM AUCTION</div><div class=ap>${p.e} <b>${p.n}</b> · only 1 left!</div>${A.rd?'':'<div class=c>The shoppers are rushing to the shelf…</div>'}<div class=ab><div id=bd0>👤 ${A.a.nm}<b id=ab0></b></div><div id=bd1>👤 ${A.b.nm}<b id=ab1></b></div></div><div class=bar><i id=abar></i></div><div class=bt><button class="btn p" data-u="hype">📣 Hype ×${A.hype}</button><button class="btn g" data-u="sold">🔨 SOLD!</button><button class="btn r" data-u="cancel">✖ No deal</button></div>`;
else{const w=A.win?A.b:A.a;el.innerHTML=`<div class=ah>🏆 SOLD!</div><div class=ap>${w.nm} wins the ${p.e} ${p.n} for <b>$${fm(A.amount)}</b></div><div class=bt>${A.dbl?'<b>Doubled ✅</b>':`<button class="btn y" data-u="dbl">📺 Watch ad: double it (+$${fm(A.amount)})</button>`}<button class="btn" data-u="close">Close</button></div>`}aucFx()}
function aucFx(){const A=AUC;if(!A.on||A.ph!='bid')return;const g=i=>$(i);if(!g('ab0'))return;g('ab0').textContent=' $'+fm(A.bid[0]);g('ab1').textContent=' $'+fm(A.bid[1]);g('bd0').className=A.top==0?'lead':'';g('bd1').className=A.top==1?'lead':'';g('abar').style.width=Math.max(0,100-A.t/A.dur*100)+'%'}
$('auc').onclick=e=>{const b=e.target.closest('[data-u]');if(!b)return;const u=b.dataset.u,A=AUC;sfx('click');
if(u=='hype'&&A.ph=='bid'&&A.rd&&A.hype>0){A.hype--;A.max[0]*=1.12;A.max[1]*=1.12;A.nx=0;toast('📣 The crowd goes wild!');sfx('upgrade');aucFull()}
else if(u=='sold'&&A.ph=='bid'&&A.rd)aucEnd(A.top<0?(Math.random()<.5?0:1):A.top);
else if(u=='cancel')aucCancel();else if(u=='close'){AUC={on:0};aucFull()}
else if(u=='dbl'){const m=left('auc');if(m<=0)return toast('Daily limit reached. Come back tomorrow!');showAd(()=>{S.ads.n.auc=(S.ads.n.auc||0)+1;aucDouble(A)})}};
setInterval(aucFx,250);
/* ---------- EVENTS, DAILY CHALLENGE, REPUTATION ---------- */
const EV={t:80};
const DC=[['served','Serve {n} customers',[20,30,45,70],6],['sold','Sell {n} products',[25,40,60,100],8],['rev','Earn ${n} in sales',[300,800,2000,5000],.2]];
function dchInit(){const t=today();if(!S.dch||S.dch.d!=t){const d=DC[Math.random()*3|0],n=d[2][Math.min(3,Math.floor((lvl()-1)/3))];S.dch={d:t,c:d[0],n,b:S[d[0]]||0,r:Math.round(n*d[3]+150),done:0,nf:0}}}
const dchProg=()=>Math.min(S.dch.n,Math.max(0,(S[S.dch.c]||0)-S.dch.b));
function claimDch(){dchInit();if(S.dch.done||dchProg()<S.dch.n)return;S.dch.done=1;S.money+=S.dch.r;mfx(S.dch.r);sfx('cash');confetti(10);save()}
const dchHtml=()=>{dchInit();const d=S.dch,t=DC.find(x=>x[0]==d.c)[1].replace('{n}',fm(d.n));return`<div class=card style="background:#fff3bf"><div class=t>📅 Daily Business Challenge</div><div>${t}</div><div class=bar><i style="width:${dchProg()/d.n*100}%"></i></div><div class=rw><span>${fm(dchProg())}/${fm(d.n)} · Reward $${fm(d.r)}</span><button class="btn g" data-s="cdc" ${!d.done&&dchProg()>=d.n?'':'disabled'}>${d.done?'Claimed ✅':'Claim'}</button></div></div>`};
function evTick(){EV.t-=1.5;
if(EV.t<=0){EV.t=120+Math.random()*180;const r=Math.random(),own=[0,1,2,3].filter(s=>S.own[s]),s=own[Math.random()*own.length|0];
if(r<.45){RUSH=Date.now()+40000;toast('🏃 SHOPPING RUSH! Customers are flooding in!');sfx('notify');confetti(6)}
else if(r<.75){spawn(s,'v');toast('👑 A VIP customer is on the way!');sfx('notify')}
else{spawn(s,'g');toast('🎁 A lucky customer is coming — big tip incoming!');sfx('notify')}}
[[1.5,250],[2,750],[2.5,2000],[3,5000]].forEach(([r,m],i)=>{if(S.rep>=r&&!(S.rm&(1<<i))){S.rm|=1<<i;S.money+=m;mfx(m);toast('⭐ Reputation milestone '+r+'! +$'+fm(m));sfx('level');confetti()}});
dchInit();if(!S.dch.done&&!S.dch.nf&&dchProg()>=S.dch.n){S.dch.nf=1;note('dch','📅 Daily challenge complete! Claim it in Missions',1000)}}
/* ---------- START ---------- */
applyUp();
function offline(){const el=(Date.now()-S.t)/1000;if(el<0){S.t=Date.now();return null}if(el<120)return null;let sold=0,m0=S.money;
STORES.forEach((st,s)=>{if(!S.own[s])return;let n=Math.min(2000,Math.floor(Math.min(el,7200)/spawnEvery()*(s>0||S.up.cashier?.5:.25)));
for(;n>0;n--){const L=PL(s),p=L[Math.random()*L.length|0];if(S.prod[p.id].stock>0&&Math.random()<dem(p)){sale(p);sold++}}});
applyUp();return sold?{sold,gain:S.money-m0}:null}
const off=offline();save();refresh();
offPending=off;initMis();S.lv=S.lv||lvl();setQ();
setTimeout(()=>{$('tap').textContent='👆 TAP TO START';$('tap').classList.add('pls');$('splash').onclick=()=>{aInit();$('splash').style.opacity=0;setTimeout(()=>$('splash').remove(),600);showMenu()}},2300);
let last=performance.now();
function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;const pz=isPaused();TT+=dt;if(pz)dt=0;
for(let s=0;s<4;s++)if(S.own[s]){spT[s]-=dt;if(spT[s]<=0){spT[s]=spawnEvery()*(.7+Math.random()*.6);if(C.filter(c=>c.s==s).length<5+2*S.up.decor)spawn(s)}}
stores.forEach(x=>x.ca.reach=0);const cashing=Math.hypot(pl.g.position.x-5,pl.g.position.z+.8)<.9;
[...C].forEach(c=>updC(c,dt));aucUpd(dt);if(go(pl,plT.x,plT.z,dt,3.4)&&cashing&&!S.up.cashier)pl.ry=-Math.PI/2;
sepAll();anim(pl,dt);C.forEach(c=>anim(c,dt));stores.forEach(x=>anim(x.ca,dt));lifeUpd(dt);pets.forEach(a=>petUpd(a,dt));carsUpd(dt);fxUpd(dt);
TGx+=(STORES[cur].ox-TGx)*Math.min(1,dt*4);cam.position.set(TGx+TG.x+14,TG.y+13,TG.z+14);cam.lookAt(TGx+TG.x,TG.y,TG.z);dl.position.set(TGx+5,12,7);dl.target.position.set(TGx,0,0);ren.render(scene,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
setInterval(refresh,500);setInterval(tick,1500);setInterval(save,5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});addEventListener('pagehide',save);
