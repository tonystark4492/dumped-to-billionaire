$('panel').onclick=e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a.split(':'))};
function act([k,a,b]){
if(k=='buy'||k=='fill'){const i=P.findIndex(x=>x.id==a),p=P[i],ps=S.prod[a];let n=k=='fill'?mx()-ps.stock:Math.min(+b,mx()-ps.stock);if(n<=0)return toast('Shelf is full!');
if(S.money<n*p.cost){n=Math.floor(S.money/p.cost);if(n<=0)return toast('Not enough cash 💸')}S.money-=n*p.cost;ps.stock+=n;shelf(i);toast(`Bought ${n} × ${p.n}`)}
else if(k=='pr'){const p=P.find(x=>x.id==a),ps=S.prod[a];ps.price=clamp(ps.price+ +b,1,p.ref*3)}
else if(k=='up'){const u=UP.find(x=>x.k==a),l=S.up[a],c=Math.round(u.base*u.mul**l);if(l>=u.max)return;if(S.money<c)return toast('Not enough cash 💸');S.money-=c;S.up[a]++;applyUp();toast('Upgraded! 🎉')}
else if(k=='export'){const s=btoa(JSON.stringify(S));try{navigator.clipboard.writeText(s)}catch(e){}prompt('Backup code (copied if possible). Save it somewhere safe:',s)}
else if(k=='import'){const s=prompt('Paste your backup code:');if(!s)return;try{const j=JSON.parse(atob(s.trim()));if(!valid(j))throw 0;S=Object.assign(fresh(),j);fix();applyUp();save();toast('Backup loaded ✅')}catch(e){toast('That code is not valid')}}
else if(k=='reset'){if(confirm('Delete ALL progress and start over?')){S=fresh();applyUp();save();toast('Fresh start')}}
save();render()}
/* ---------- START ---------- */
applyUp();
function offline(){const el=(Date.now()-S.t)/1000;if(el<0){S.t=Date.now();return null}if(el<120)return null;
let n=Math.min(2000,Math.floor(Math.min(el,7200)/spawnEvery()*(S.up.cashier?.5:.25))),m0=S.money,sold=0;
for(;n>0;n--){const p=P[Math.random()*cnt()|0];if(S.prod[p.id].stock>0&&Math.random()<dem(p)){sale(p);sold++}}
applyUp();return sold?{sold,gain:S.money-m0}:null}
const off=offline();save();refresh();
const intro=()=>S.intro?0:modal(`<h2>💔 DUMPED TO BILLIONAIRE</h2><p>She called you <b>broke</b>. So you rented a tiny shop that smells like old chips.</p><p><b>Tap the floor</b> to walk. Stand near the <b>purple counter</b> to ring up customers. Keep shelves stocked, set smart prices, and build an empire!</p><p><i>"She called you broke. Build an empire."</i></p>`,'Start hustling 💪',()=>{S.intro=1;save()});
off?modal(`<h2>Welcome back! 💰</h2><p>While you were away, your shop sold <b>${off.sold}</b> items and earned <b>$${fm(off.gain)}</b>.</p><p>(Offline earnings are capped at 2 hours and limited by your stock.)</p>`,'Collect',()=>{refresh();intro()}):intro();
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
spT-=dt;if(spT<=0){spT=spawnEvery()*(.7+Math.random()*.6);if(C.length<5+2*S.up.decor)spawn()}
[...C].forEach(c=>updC(c,dt));mv(pl,plT.x,plT.z,dt,3.4);anim(pl,dt);C.forEach(c=>anim(c,dt));
TT+=dt;anim(ca,dt);fxUpd(dt);ren.render(scene,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
setInterval(()=>{refresh()},500);setInterval(save,5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});addEventListener('pagehide',save);
</script></body></html>
