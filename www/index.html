if(d<.1){a.w=1+Math.random()*3;a.tx=-4+Math.random()*7;a.tz=1.6+Math.random()*2;a.g.position.y=0;return}
const st=Math.min((a.k==2?1.3:.9)*dt,d);a.g.position.x+=dx/d*st;a.g.position.z+=dz/d*st;a.t+=dt*(a.k==3?12:9);a.g.position.y=Math.abs(Math.sin(a.t))*(a.k==3?.3:.1);
a.g.rotation.y+=(((Math.atan2(dx,dz)-a.g.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI)*Math.min(1,dt*8)}

o.g.position.set(Math.random()-.5,0,12);o.st='door';o.s=s;o.pi=Math.random()*cnt(s)|0;o.wtp=(.75+Math.random()*.75)*(1+.06*S.up.decor);C.push(o)}

else if(c.st=='shelf'){const b=bs(c.pi);if(mv(c,b[0],b[1],dt)){c.st='browse';c.tm=1.4+Math.random();c.look=1;c.reach=1;c.ry=LAY[c.pi>>1][5];pop(p.e,c.g)}}
else if(c.st=='browse'){c.tm-=dt;if(c.tm<=0){c.look=0;c.reach=0;if(ps.stock<=0)bad(c,'😠 Out of '+p.n,.03);else if(ps.price/p.ref>c.wtp)bad(c,'💸 Too pricey!',.01);else if(q.length>=4)bad(c,'😤 Too crowded',.01);else{q.push(c);c.st='queue';c.srv=0}}}
else if(c.st=='queue'){const i=q.indexOf(c),at=mv(c,3.9,1.9+i*.95,dt);
if(i==0&&at){c.ry=Math.PI;if(staffed(s)){c.srv+=dt;if(c.srv>=coTime()){q.shift();if(ps.stock<=0)bad(c,'😠 Sold out!',.03);else{pop('+$'+sale(p),c.g);fly(s,c.pi);c.hop=.5;c.st='leave';shelf(s,c.pi)}}}}}
else if(c.st=='leave'){if(mv(c,0,4.6,dt))c.st='out'}

/* ---------- UI ---------- */
let tab='',tt;

function modal(h,btn,cb){$('mbox').innerHTML=h+`<br><button id="mok">${btn}</button>`;$('modal').style.display='flex';$('mok').onclick=()=>{$('modal').style.display='none';cb&&cb()}}
const D=[['📱','Your first shop. Gadgets and accessories.'],['🐾','Dogs, cats, birds, hamsters and supplies. Has its own shop keeper!'],['👗','Clothes, shoes and fashion. Has its own shop keeper!'],['🍔','Snacks, meals and treats. Has its own shop keeper!']];
function ups(){const s=cur;return[{k:'shelf',n:'📚 Bigger Shelves',d:'+10 max stock per product',base:150,mul:1.8,max:5},{k:'decor',n:'🪴 Decorations',d:'More visitors, and customers accept higher prices',base:200,mul:2,max:5},{k:'counter',n:'⚡ Faster Checkout',d:'Customers get served quicker',base:120,mul:1.8,max:5},
...(s==0?[{k:'cashier',n:'🧑‍💼 Hire Cashier',d:'Checkout works without you at the counter',base:250,mul:1,max:1}]:[]),{k:'range',n:'🛍️ New Product Range',d:'Unlocks new shelves and products (2 levels)',base:[400,800,1500,2500][s],mul:3.75,max:2}]}
const lv=k=>k=='range'?S.up.r[cur]:S.up[k];
function render(){const pn=$('panel');if(!tab){pn.style.display='none';return}pn.style.display='block';let h='';
if(tab=='stock'){h+=`<div class=row><span>Sold <b data-v=sold></b></span><span>Revenue <b data-v=rev></b></span><span>Profit <b data-v=profit></b></span></div>`;
PL(cur).forEach(p=>h+=`<div class=card><div class=t>${p.e} ${p.n}</div><div>Stock <b data-v="st:${p.id}"></b> · Cost $${p.cost} each</div><div class=bt><button data-a="buy:${p.id}:5">Buy 5</button><button data-a="buy:${p.id}:10">Buy 10</button><button data-a="fill:${p.id}" data-v="fc:${p.id}"></button></div></div>`)}
if(tab=='price'){h+=`<div class=row>Higher price = more profit per sale but fewer buyers.</div>`;
PL(cur).forEach(p=>h+=`<div class=card><div class=t>${p.e} ${p.n} (cost $${p.cost})</div><div class=bt><button data-a="pr:${p.id}:-5">−5</button><button data-a="pr:${p.id}:-1">−1</button><b data-v="pr:${p.id}" style="font-size:20px;min-width:52px;text-align:center"></b><button data-a="pr:${p.id}:1">+1</button><button data-a="pr:${p.id}:5">+5</button></div><div>Profit per sale <b data-v="pf:${p.id}"></b> · Buyers who accept <b data-v="dm:${p.id}"></b></div></div>`)}
if(tab=='up')ups().forEach(u=>{const l=lv(u.k),c=Math.round(u.base*u.mul**l);h+=`<div class=card><div class=t>${u.n} · Lv ${l}/${u.max}</div><div>${u.d}</div><div class=bt>${l>=u.max?'<b>MAX ✅</b>':`<button data-a="up:${u.k}">Buy · $${fm(c)}</button>`}</div></div>`});
if(tab=='stores')STORES.forEach((st,s)=>h+=`<div class=card><div class=t>${D[s][0]} ${st.n}</div><div>${D[s][1]}</div><div class=bt>${S.own[s]?(cur==s?'<b>👀 Viewing now</b>':`<button data-a="store:${s}">Go to shop</button>`):`<button data-a="store:${s}">Buy · $${fm(st.cost)}</button>`}</div></div>`);
if(tab=='free'){h+=`<div class=row>Ads are optional. You are rewarded only after the ad finishes.</div>`;ADS.forEach(a=>h+=`<div class=card><div class=t>${a.n}</div><div>${a.d()}</div><div class=bt><button data-a="ad:${a.k}">📺 Watch ad · ${left(a.k)} left today</button></div></div>`)}
if(tab=='menu')h+=`<div class="card m"><div class=t>Save & backup</div><div>Your game saves automatically on this phone and works offline.</div><div class=bt><button data-a="export">Export backup</button><button data-a="import">Import backup</button><button data-a="reset">Reset game</button></div></div>`;
pn.innerHTML=h;refresh()}
function refresh(){$('money').textContent='$'+fm(S.money);$('stars').textContent='⭐ '+S.rep.toFixed(1);$('sn').textContent='🏪 '+STORES[cur].n+(Date.now()<S.boost?' 📣x2':'');
const out=[];STORES.forEach((st,s)=>S.own[s]&&PL(s).forEach(p=>S.prod[p.id].stock<=0&&out.push(p.n)));$('alert').textContent=out.length?'⚠️ Out of stock: '+out.slice(0,3).join(', ')+(out.length>3?' +'+(out.length-3):''):'';
$$('[data-v]').forEach(el=>{const[k,i]=el.dataset.v.split(':'),ps=i&&S.prod[i],p=i&&ALL.find(x=>x.id==i);let t='';
if(k=='sold')t=fm(S.sold);else if(k=='rev')t='$'+fm(S.rev);else if(k=='profit')t='$'+fm(S.profit);
else if(k=='st'){t=ps.stock+'/'+mx();el.className=ps.stock<=0?'low':''}else if(k=='pr')t='$'+ps.price;else if(k=='pf')t='$'+(ps.price-p.cost);
else if(k=='dm')t=Math.round(dem(p)*100)+'%';else if(k=='fc')t='Fill ($'+fm(Math.max(0,mx()-ps.stock)*p.cost)+')';el.textContent=t})}
$('tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;tab=tab==b.dataset.t?'':b.dataset.t;render()};
$('panel').onclick=e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a.split(':'))};
function act([k,a,b]){
if(k=='buy'||k=='fill'){const p=ALL.find(x=>x.id==a),i=STORES[cur].P.indexOf(p),ps=S.prod[a];let n=k=='fill'?mx()-ps.stock:Math.min(+b,mx()-ps.stock);if(n<=0)return toast('Shelf is full!');
if(S.money<n*p.cost){n=Math.floor(S.money/p.cost);if(n<=0)return toast('Not enough cash 💸')}S.money-=n*p.cost;ps.stock+=n;shelf(cur,i);toast(`Bought ${n} × ${p.n}`)}
else if(k=='pr'){const p=ALL.find(x=>x.id==a);S.prod[a].price=clamp(S.prod[a].price+ +b,1,p.ref*3)}
else if(k=='up'){const u=ups().find(x=>x.k==a),l=lv(a),c=Math.round(u.base*u.mul**l);if(l>=u.max)return;if(S.money<c)return toast('Not enough cash 💸');S.money-=c;if(a=='range')S.up.r[cur]++;else S.up[a]++;applyUp();toast('Upgraded! 🎉')}
else if(k=='store'){const s=+a;if(!S.own[s]){if(S.money<STORES[s].cost)return toast('Not enough cash 💸');S.money-=STORES[s].cost;S.own[s]=1;applyUp();toast('New shop opened! 🎉')}cur=s;if(s>0)toast('Buy stock for this shop in the Stock tab 📦')}
else if(k=='ad'){if(left(a)<=0)return toast('Daily limit reached. Come back tomorrow!');showAd(()=>reward(a))}
else if(k=='export'){const s=btoa(JSON.stringify(S));try{navigator.clipboard.writeText(s)}catch(e){}prompt('Backup code (copied if possible). Save it somewhere safe:',s)}
else if(k=='import'){const s=prompt('Paste your backup code:');if(!s)return;try{const j=JSON.parse(atob(s.trim()));if(!valid(j))throw 0;S=Object.assign(fresh(),j);fix();applyUp();save();toast('Backup loaded ✅')}catch(e){toast('That code is not valid')}}
else if(k=='reset'){if(confirm('Delete ALL progress and start over?')){S=fresh();fix();cur=0;applyUp();save();toast('Fresh start')}}
save();render()}
/* ---------- REWARDED ADS (test ads until you add your real AdMob IDs) ---------- */
const TEST=true,ADUNIT='ca-app-pub-3940256099942544/5224354917',AD=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.AdMob;let adInit=0,adBusy=0;
const ADS=[{k:'cash',n:'💰 Bonus Cash',lim:5,d:()=>'Get $'+fm(bonus())},{k:'stock',n:'📦 Free Stock',lim:3,d:()=>'+8 of every product in the shop you are viewing'},{k:'boost',n:'📣 Marketing Campaign',lim:3,d:()=>'Double customers for 5 minutes'+(Date.now()<S.boost?' (active now)':'')}];

const done=()=>{if(fin)return;fin=1;hs.forEach(h=>h&&h.remove&&h.remove());adBusy=0},no=()=>{toast('No ad available. Try again later');done()};
