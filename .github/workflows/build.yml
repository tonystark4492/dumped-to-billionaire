name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  # Google's TEST AdMob app ID. Replace with your real one when your AdMob account is ready.
  ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Copy 3D engine into the game (so it works offline)
        run: cp node_modules/three/build/three.module.min.js www/three.module.min.js

      - name: Create Android project
        run: npx cap add android

      - name: Add AdMob app ID to the Android manifest
        run: |
          sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/></application>#" android/app/src/main/AndroidManifest.xml

      - name: Sync game files
        run: npx cap sync android

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dumped-to-billionaire-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
