name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  # Google's TEST AdMob app ID. Replace with your real one when your AdMob account is ready.
  ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Copy 3D engine into the game (so it works offline)
        run: cp node_modules/three/build/three.module.min.js www/three.module.min.js

      - name: Create Android project
        run: npx cap add android

      - name: Full-screen game (hide status bar + navigation bar, portrait only)
        run: |
          F=android/app/src/main/java/com/dumped/billionaire/MainActivity.java
          cat > $F <<'JAVA'
          package com.dumped.billionaire;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            private int cutTop = 0, cutBottom = 0;

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              if (Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams lp = getWindow().getAttributes();
                lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                getWindow().setAttributes(lp);
              }
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              View root = getWindow().getDecorView();
              ViewCompat.setOnApplyWindowInsetsListener(root, (v, insets) -> {
                Insets c = insets.getInsets(WindowInsetsCompat.Type.displayCutout());
                float d = getResources().getDisplayMetrics().density;
                cutTop = Math.round(c.top / d);
                cutBottom = Math.round(c.bottom / d);
                pushCut();
                return ViewCompat.onApplyWindowInsets(v, insets);
              });
              hideBars();
            }

            private void pushCut() {
              try {
                final WebView w = getBridge().getWebView();
                if (w == null) return;
                final String js = "document.documentElement.style.setProperty('--cut','" + cutTop + "px');document.documentElement.style.setProperty('--cutb','" + cutBottom + "px');";
                w.post(() -> w.evaluateJavascript(js, null));
                w.postDelayed(() -> w.evaluateJavascript(js, null), 1500);
                w.postDelayed(() -> w.evaluateJavascript(js, null), 4000);
              } catch (Exception e) { }
            }

            private void hideBars() {
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.hide(WindowInsetsCompat.Type.systemBars());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
            }

            @Override
            public void onResume() { super.onResume(); hideBars(); pushCut(); }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) { hideBars(); pushCut(); }
            }
          }
          JAVA
          sed -i 's/^          //' $F
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' android/app/src/main/AndroidManifest.xml
          grep -c "screenOrientation" android/app/src/main/AndroidManifest.xml

      - name: Set app version (every build gets a higher number, so it installs over the old APK)
        run: |
          NAME=$(node -p "require('./package.json').version")
          CODE=$((1000 + ${{ github.run_number }}))
          sed -i "s/versionCode [0-9]*/versionCode $CODE/; s/versionName \".*\"/versionName \"$NAME\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          echo "APP_VERSION=$NAME" >> $GITHUB_ENV
          echo "::notice::Building version $NAME (code $CODE)"

      - name: Add AdMob app ID to the Android manifest
        run: |
          sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/></application>#" android/app/src/main/AndroidManifest.xml

      - name: Sync game files
        run: npx cap sync android

      - name: Use the permanent signing key (so new builds can update the installed app)
        run: |
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
          elif [ -f debug.keystore.b64 ]; then
            base64 -d debug.keystore.b64 > ~/.android/debug.keystore || true
          else
            echo "::warning::No signing key file found. This build gets a random key, so it cannot be installed over the old game."
          fi
          if [ -f ~/.android/debug.keystore ]; then
            if ! keytool -list -keystore ~/.android/debug.keystore -storepass android > /dev/null 2>&1; then
              echo "::error::The signing key file is incomplete or damaged. Upload debug.keystore again (or paste the whole debug.keystore.b64 text, from MIIK to the final equals sign)."
              exit 1
            fi
          fi

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dumped-to-billionaire-v${{ env.APP_VERSION }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
